name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Package and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release tag and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH format; received: $TAG" >&2
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main
          release_sha="$(git rev-parse "${TAG}^{commit}")"
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "release_sha=$release_sha" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run structural validator
        run: python scripts/validate_rap.py --root .

      - name: Create source archive
        env:
          TAG: ${{ github.ref_name }}
          TAGGED_SHA: ${{ env.release_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix="RAP-${TAG}/" --output="dist/RAP-${TAG}.zip" "$TAGGED_SHA"
          sha256sum "dist/RAP-${TAG}.zip" > "dist/RAP-${TAG}.zip.sha256"

      - name: Verify archive contents
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          unzip -Z1 "dist/RAP-${TAG}.zip" | tee dist/archive-contents.txt
          if grep -Eq '(^|/)\.git(/|$)|(^|/)\.github(/|$)|/(\.gitignore|\.gitattributes)$' dist/archive-contents.txt; then
            echo "The release archive contains repository-only files." >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=("dist/RAP-${TAG}.zip" "dist/RAP-${TAG}.zip.sha256")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "RAP ${TAG}" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi